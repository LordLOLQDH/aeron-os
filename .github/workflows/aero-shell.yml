name: Aero Shell

on:
  push:
    paths:
      - "aero-shell/**"
      - "aero-update/**"
      - "aero-rescue/**"
      - "VERSION"
      - "aero.conf"
      - "tests/**"
      - ".github/workflows/aero-shell.yml"
  pull_request:
    paths:
      - "aero-shell/**"
      - "aero-update/**"
      - "aero-rescue/**"
      - "VERSION"
      - "aero.conf"
      - "tests/**"
      - ".github/workflows/aero-shell.yml"

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aero Shell testen
        run: bash tests/test-shell.sh
